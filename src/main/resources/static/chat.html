<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Chat - 打字机效果测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container {
            width: 800px;
            max-width: 95vw;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #2563eb;
            color: #fff;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 600;
        }
        .chat-messages {
            flex: 1;
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .message.ai .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: #333;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .chat-input {
            display: flex;
            border-top: 1px solid #e5e5e5;
            padding: 12px 16px;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input input:focus {
            border-color: #2563eb;
        }
        .chat-input button {
            padding: 10px 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover { background: #1d4ed8; }
        .chat-input button:disabled { background: #93c5fd; cursor: not-allowed; }
        .status {
            padding: 6px 16px;
            font-size: 12px;
            color: #888;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">AI 助手 - 打字机效果测试</div>
        <div class="status" id="status">就绪</div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input">
            <input type="text" id="input" placeholder="输入消息..." />
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');
        let memoryId = 1;

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;
        }

        function addAiMessageWithCursor() {
            const div = document.createElement('div');
            div.className = 'message ai';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            div.appendChild(cursor);
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return { div, cursor };
        }

        function removeCursor(cursor) {
            if (cursor && cursor.parentNode) {
                cursor.parentNode.removeChild(cursor);
            }
        }

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // 显示用户消息
            addMessage('user', text);
            input.value = '';

            // 禁用输入
            sendBtn.disabled = true;
            input.disabled = true;
            statusEl.textContent = 'AI 正在思考...';

            // 创建 AI 消息区域（带光标）
            const { div: aiDiv, cursor } = addAiMessageWithCursor();

            const startTime = Date.now();
            let fullText = '';

            try {
                const resp = await fetch(`http://localhost:8080/api/ai/chat?memoryId=${memoryId}&message=${encodeURIComponent(text)}`);

                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                statusEl.textContent = 'AI 回复中 (流式)...';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // 解析 SSE: 每行 "data:xxx"
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 最后一行可能不完整，保留

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('data:')) {
                            const data = trimmed.slice(5); // 去掉 "data:" 前缀
                            if (data === '[DONE]') continue;
                            fullText += data;
                            // 更新显示
                            removeCursor(cursor);
                            aiDiv.textContent = fullText;
                            messagesDiv.scrollTop = messagesDiv.scrollHeight;
                        }
                    }
                }
            } catch (err) {
                fullText = `[错误] ${err.message}`;
                removeCursor(cursor);
                aiDiv.textContent = fullText;
                aiDiv.style.color = '#e53e3e';
                statusEl.textContent = `错误: ${err.message}`;
            }

            removeCursor(cursor);
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            statusEl.textContent = `回复完成 (${elapsed}s, ${fullText.length} 字)`;

            // 恢复输入
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
